<svg xmlns="http://www.w3.org/2000/svg" width="640" height="743" viewBox="0 0 640 743" role="img" aria-labelledby="uart-timing-title uart-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-timing-title">UART single wire bytes</title>
<desc id="uart-timing-desc">UART timing of the TMC5160 on its single wire SWP: the first byte carries the sync nibble the chip measures its baud rate from, and the start bits of two bytes must follow within the pause the datasheet allows.</desc>
