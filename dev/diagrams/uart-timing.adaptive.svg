<text x="479.6" y="207.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">node address byte</text>
<text x="32" y="256.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">SWP</text>
