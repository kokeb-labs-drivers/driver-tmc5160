<text x="234.9" y="286.1" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">tPAUSE</text>
<text x="32" y="333.5" font-size="17" font-weight="700" class="fk-f-ink">Timing values</text>
<text x="32" y="369.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">baud</text>
<text x="608" y="369.9" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 9000 · max fCLK / 16 bit/s</text>
<text x="32" y="390.1" font-size="15" class="fk-f-ink2">Baud rate (minimum assuming a 20 MHz clock)</text>
<text x="32" y="410.3" font-size="14" class="fk-f-muted">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="32" y="442.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tPAUSE</text>
<text x="608" y="442.8" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 63 bit times</text>
<text x="32" y="463" font-size="15" class="fk-f-ink2">Start bit to the next start bit within a datagram (longer resets the link)</text>
<text x="32" y="483.1" font-size="14" class="fk-f-muted">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="32" y="515.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tIDLE</text>
<text x="608" y="515.6" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 12 bit times</text>
<text x="32" y="535.9" font-size="15" class="fk-f-ink2">Bus idle time before a new datagram after a reset or an error</text>
<text x="32" y="556" font-size="14" class="fk-f-muted">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="46" y="610.2" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="630.6" font-size="15" class="fk-f-slate-text">The chip measures the bit time from the falling edge of the start bit to</text>
<text x="46" y="652.3" font-size="15" class="fk-f-slate-text">the falling edge between sync bits 2 and 3, on every datagram. Each</text>
<text x="46" y="674.1" font-size="15" class="fk-f-slate-text">byte is sent least significant bit first; the bytes of a datagram go highest</text>
<text x="46" y="695.8" font-size="15" class="fk-f-slate-text">byte first.</text>
</svg>
