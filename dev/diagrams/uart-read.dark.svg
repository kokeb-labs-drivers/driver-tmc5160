<text x="314.3" y="319.9" font-size="14" font-weight="700" fill="#E8EDF3">tSEND</text>
<text x="559" y="319.9" font-size="14" font-weight="700" fill="#E8EDF3">tOFF</text>
<text x="32" y="349.3" font-size="17" font-weight="700" fill="#E8EDF3">Values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">tSEND</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 8 bit times</text>
<text x="32" y="405.9" font-size="15" fill="#D2DAE4">Request to reply delay at SENDDELAY 0 or 1, the default</text>
<text x="32" y="426.1" font-size="14" fill="#9AA6B5">Datasheet 6.1 General Configuration Registers, p. 34</text>
<text x="32" y="458.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">tSEND</text>
<text x="608" y="458.6" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 120 bit times</text>
<text x="32" y="478.8" font-size="15" fill="#D2DAE4">Request to reply delay at SENDDELAY 14 or 15</text>
<text x="32" y="498.9" font-size="14" fill="#9AA6B5">Datasheet 6.1 General Configuration Registers, p. 34</text>
<text x="32" y="531.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">tOFF</text>
<text x="608" y="531.4" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 4 bit times</text>
<text x="32" y="551.7" font-size="15" fill="#D2DAE4">Reply transmitter released after its last bit</text>
<text x="32" y="571.8" font-size="14" fill="#9AA6B5">Datasheet 5.1.2 Read Access, p. 27</text>
<text x="46" y="626" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="646.4" font-size="15" fill="#E2E8F0">With several nodes, set SENDDELAY to 2 or more (3 × 8 bit times) on</text>
<text x="46" y="668.1" font-size="15" fill="#E2E8F0">every node. The reply uses the baud rate of the request; a read does not</text>
<text x="46" y="689.9" font-size="15" fill="#E2E8F0">change IFCNT.</text>
</svg>
