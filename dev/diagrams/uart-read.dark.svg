<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">UART register read</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 6.1 General Configuration Registers, p. 34; 5.1.2 Read Access, p.</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">27; 5 UART Single Wire Interface, p. 26.</text>
