<text x="185.9" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">request, 4 bytes</text>
<text x="418.4" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">reply, 8 bytes</text>
<text x="32" y="224.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Host</text>
<text x="112.5" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">sync</text>
<text x="161.4" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">node</text>
<text x="210.4" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">reg</text>
<text x="259.3" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">CRC</text>
<text x="32" y="272.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Chip</text>
<text x="332.8" y="271.7" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">sync</text>
<text x="381.7" y="271.7" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">FF</text>
<text x="430.7" y="271.7" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">reg</text>
<text x="504.1" y="271.7" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC</text>
