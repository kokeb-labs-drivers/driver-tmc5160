<svg xmlns="http://www.w3.org/2000/svg" width="640" height="737" viewBox="0 0 640 737" role="img" aria-labelledby="uart-read-title uart-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-read-title">UART register read</title>
<desc id="uart-read-desc">One UART register read of the TMC5160: the host sends a four-byte request, the chip waits SENDDELAY and answers on the same wire with an eight-byte reply, then releases the line.</desc>
