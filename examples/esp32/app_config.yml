---
# TMC5160 ESP32 examples: the app matrix read by the build scripts, the CI and the docs Examples page.
version: "1.0"

metadata:
  project: "ESP32 TMC5160 Driver Examples"
  default_app: "tmc5160_basic_example"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  tmc5160_basic_example:
    description: "Start the TMC5160 over SPI from menuconfig values, move one revolution each way and log the position"
    source_file: "tmc5160_basic_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "ESP-IDF spi_master port (mode 3) with DRV_ENN and DIAG0 on GPIO"
      - "Config from Kconfig (menuconfig) through tmc5160_kconfig.hpp"
      - "Every Result checked and logged by name"

  tmc5160_uart_example:
    description: "Start the TMC5160 over the single wire UART, run a velocity move and log the interface counter"
    source_file: "tmc5160_uart_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: false
    hardware_required: true
    features:
      - "ESP-IDF uart port with echo removal on a shared wire"
      - "Enable() checks the interface counter against the writes sent"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc5160_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
