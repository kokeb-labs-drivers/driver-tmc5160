<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">TMC5160, inc/tmc5160.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="989.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="1020.2" font-size="17" fill="#D2DAE4">SpiInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="1142.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="1171.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Transfer()</text>
<text x="56" y="1294.6" font-size="20" font-weight="700" fill="#E2E8F0">TMC5160</text>
<text x="56" y="1325.2" font-size="17" fill="#D2DAE4">the chip, on the SPI bus</text>
<rect x="322.9" y="910.6" width="214.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="928.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">register reads and writes</text>
<rect x="329.6" y="1063.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="1081.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="371.8" y="1215.6" width="116.4" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="1233.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">SPI transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
