kind: topology
id: uart-topology
title: UART nodes on one wire
kicker: Several drivers
alt: >-
  Several TMC5160 drivers on one single wire UART: the MCU and every driver share SWP, an idle resistor holds the line
  high, and each NAO output enables the next driver's NAI while the node addresses are programmed.
reads: >-
  The MCU, a UART whose TXD goes to high impedance to receive, shares the SWP line with TMC5160 1, the drivers left
  out and TMC5160 N. TMC5160 1 has NAI tied to ground and answers at address 0 first; each driver that has its address
  sets NAO low and so lets the next driver answer at address 0.
