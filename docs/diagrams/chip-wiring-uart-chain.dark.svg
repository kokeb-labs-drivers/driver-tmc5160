<text x="544.7" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DIAG1_SWP</text>
<rect x="508.7" y="274.3" width="14" height="12" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
