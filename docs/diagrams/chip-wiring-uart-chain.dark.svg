<text x="859.1" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">NAO  pin 16</text>
<text x="50" y="575.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#FECDD3">VCC_IO: VCC_IO; also U2.VIO · GND: EP, GNDA, GNDD; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 1 resistor around the supplies (values in the full schematic). 41 pins are not drawn in this circuit; the</text>
<text x="50" y="716.4" font-size="17" fill="#E2E8F0">full schematic lists them.</text>
<text x="32" y="762.4" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: R1: the series value is a choice; the datasheet shows the wiring only.</text>
