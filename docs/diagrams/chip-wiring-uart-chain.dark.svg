<text x="921.5" y="206.7" font-size="16" font-weight="700" fill="#A7F3E6">TMC5160 node 2 (supply</text>
<text x="921.5" y="227.5" font-size="16" font-weight="700" fill="#A7F3E6">and ground as node 1)</text>
<text x="760.7" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">SDO_CFG0</text>
