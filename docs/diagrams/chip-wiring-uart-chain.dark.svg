<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="chip-wiring-uart-chain-title chip-wiring-uart-chain-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-uart-chain-title">Wiring: UART chain of two nodes</title>
<desc id="chip-wiring-uart-chain-desc">Wiring of the TMC5160A for the UART chain of two nodes: MCU UART RX to DIAG1_SWP (Exchange()); MCU UART TX to DIAG1_SWP through R1 1 kΩ (Exchange()); MCU GPIO to DRV_ENN (GpioSet(CtrlPin::DrvEnn)); SDO_CFG0 to TMC5160 node 2 (supply and ground as node 1) NAI. Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="829" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: UART chain of two nodes</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: 5.4 Addressing Multiple Nodes, p. 29.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
