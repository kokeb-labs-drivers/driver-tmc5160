<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 1200 892" role="img" aria-labelledby="chip-frame-spi-title chip-frame-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi-title">TMC5160A: SPI datagram</title>
<desc id="chip-frame-spi-desc">SPI datagram of the TMC5160A, 40 bits, most significant bit first. Write: W (bit 39), address (bits 38 to 32), data (bits 31 to 0); Read: W (bit 39), address (bits 38 to 32), any value (ignored) (bits 31 to 0); Reply: SPI_STATUS (bits 39 to 32), data of the previous read (or the previous write) (bits 31 to 0). The SPI_STATUS field of the Reply row: bit 7 status_stop_r, bit 6 status_stop_l, bit 5 position_reached, bit 4 velocity_reached, bit 3 standstill, bit 2 sg2, bit 1 driver_error, bit 0 reset_flag. Below, the SPI mode 3 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="891" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">TMC5160A: SPI datagram</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Every transfer is one 40-bit datagram with CSN low; the reply carries the status and the data asked for in the previous</text>
<text x="32" y="141.5" font-size="18" fill="#566070">datagram. 40 bits, sent most significant bit first. Datasheet: 4.1 SPI Datagram Structure, p. 23.</text>
