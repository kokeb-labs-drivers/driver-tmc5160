<text x="32" y="502.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CSN</text>
<text x="32" y="548.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCK</text>
<text x="32" y="594.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDI</text>
<text x="355.4" y="594.3" font-size="16" font-weight="600" text-anchor="middle" fill="#1E429F">address</text>
<text x="786.4" y="594.3" font-size="16" font-weight="600" text-anchor="middle" fill="#14532D">data</text>
<text x="32" y="640.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDO</text>
<text x="344.4" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#5B21B6">STATUS</text>
<text x="786.4" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#14532D">data of the previous read (or the previous write)</text>
<text x="32" y="682.3" font-size="16" fill="#566070">SPI mode 3: SCK idles high; the chip samples its input on the rising edge and changes its output after the falling edge. CSN stays low for the</text>
<text x="32" y="705.5" font-size="16" fill="#566070">whole frame.</text>
<text x="32" y="748.9" font-size="20" font-weight="700" fill="#0E1726">SPI_STATUS, one flag per bit (datasheet 4.1.2, p. 24)</text>
<rect x="40" y="775.9" width="51.4" height="26" rx="13" fill="#334155"/>
