<path d="M574.6 160.9 L594.6 160.9" fill="none" stroke-width="2" class="fk-s-ink2"/>
<path d="M584.6 160.9 L584.6 170.9" fill="none" stroke-width="1.6" class="fk-s-ink2"/>
