<rect x="32" y="230.9" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="32" y="314.9" width="503.3" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="322.9" width="4" height="80" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="428.9" width="503.3" height="74" rx="10" stroke-width="1" stroke-dasharray="6 4" class="fk-f-card fk-s-line"/>
<rect x="32" y="520.9" width="503.3" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="528.9" width="4" height="80" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="638.9" width="576" height="152.1" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="52" y="251.3" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="279.1" font-size="15" class="fk-f-ink2">UART, TXD released to receive</text>
<text x="52" y="343.3" font-size="17" font-weight="700" class="fk-f-teal-text">TMC5160 1</text>
<text x="52" y="371.1" font-size="15" class="fk-f-ink2">address 254</text>
<text x="52" y="392.8" font-size="15" class="fk-f-ink2">NAI to GND</text>
<text x="52" y="457.3" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="485.1" font-size="15" class="fk-f-ink2">NAI from the NAO before</text>
<text x="52" y="549.3" font-size="17" font-weight="700" class="fk-f-teal-text">TMC5160 N</text>
<text x="52" y="577.1" font-size="15" class="fk-f-ink2">address 255 - N</text>
<text x="52" y="598.8" font-size="15" class="fk-f-ink2">NAI from the NAO before</text>
<text x="584.6" y="144.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SWP</text>
<circle cx="584.6" cy="238.9" r="3.6" class="fk-f-ink2"/>
<circle cx="584.6" cy="330.9" r="3.6" class="fk-f-ink2"/>
<circle cx="584.6" cy="444.9" r="3.6" class="fk-f-ink2"/>
<circle cx="584.6" cy="536.9" r="3.6" class="fk-f-ink2"/>
<rect x="580.6" y="176.9" width="8" height="22" rx="2" stroke-width="1.4" class="fk-f-amber-tint fk-s-amber-strong"/>
<text x="547.3" y="158.9" font-size="14" font-weight="600" text-anchor="end" class="fk-f-amber-text">RIDLE to +VIO, 3.3 kΩ for 14 nodes</text>
<text x="46" y="667.4" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="687.8" font-size="15" class="fk-f-slate-text">Up to 255 nodes: each programmed driver sets NAO low and the next</text>
<text x="46" y="709.5" font-size="15" class="fk-f-slate-text">one answers at address 0 (5.4, p. 29). Two nodes: tie their NAI pins to</text>
<text x="46" y="731.2" font-size="15" class="fk-f-slate-text">different levels (5.4, p. 29). Address 255 is reserved for replies to the</text>
<text x="46" y="753" font-size="15" class="fk-f-slate-text">master (5.1.2, p. 27). With several nodes set SENDDELAY to 2 or more</text>
<text x="46" y="774.8" font-size="15" class="fk-f-slate-text">(5.1.2, p. 27).</text>
</svg>
