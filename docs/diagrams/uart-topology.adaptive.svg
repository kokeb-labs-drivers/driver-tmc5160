<svg xmlns="http://www.w3.org/2000/svg" width="640" height="821" viewBox="0 0 640 821" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-topology-title">UART nodes on one wire</title>
<desc id="uart-topology-desc">Several TMC5160 drivers on one single wire UART: the MCU and every driver share SWP, an idle resistor holds the line high, and each NAO output enables the next driver's NAI while the node addresses are programmed.</desc>
