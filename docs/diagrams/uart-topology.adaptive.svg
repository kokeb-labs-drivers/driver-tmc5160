<rect x="0.5" y="0.5" width="639" height="820" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DRIVERS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">UART nodes on one wire</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 5.4 Addressing Multiple Nodes, p. 29; 5.1.2 Read Access, p. 27.</text>
<rect x="32" y="118.7" width="576" height="1" class="fk-f-hair"/>
<path d="M584.6 170.9 L584.6 608.9" fill="none" stroke-width="2.2" class="fk-s-ink2"/>
