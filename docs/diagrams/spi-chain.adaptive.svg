<circle cx="542" cy="516.9" r="3.6" class="fk-f-ink2"/>
<text x="586" y="164.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">CSN</text>
<circle cx="586" cy="190.9" r="3.6" class="fk-f-ink2"/>
<circle cx="586" cy="311.9" r="3.6" class="fk-f-ink2"/>
<circle cx="586" cy="430.4" r="3.6" class="fk-f-ink2"/>
<circle cx="586" cy="526.9" r="3.6" class="fk-f-ink2"/>
<text x="46" y="658.3" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="678.8" font-size="15" class="fk-f-slate-text">Each driver delays the data by 40 clocks; send 40 bits per driver in one</text>
<text x="46" y="700.5" font-size="15" class="fk-f-slate-text">CSN low phase (4.2, p. 24). Each driver takes the last 40 bits it holds</text>
<text x="46" y="722.2" font-size="15" class="fk-f-slate-text">when CSN rises (4.2, p. 24).</text>
</svg>
