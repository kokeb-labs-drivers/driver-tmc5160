<text x="82" y="193.3" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="82" y="221.1" font-size="15" class="fk-f-ink2">SPI controller</text>
<text x="82" y="314.3" font-size="17" font-weight="700" class="fk-f-teal-text">TMC5160 1</text>
<text x="82" y="342.1" font-size="15" class="fk-f-ink2">first</text>
<text x="82" y="435.3" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="82" y="529.3" font-size="17" font-weight="700" class="fk-f-teal-text">TMC5160 N</text>
<text x="82" y="557.1" font-size="15" class="fk-f-ink2">last</text>
<text x="118" y="267.8" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">MOSI → SDI</text>
<text x="118" y="598.3" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">SDO → MISO</text>
<text x="542" y="164.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SCK</text>
