<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DRIVERS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">SPI daisy chain</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 4.2 SPI Signals, p. 24.</text>
