<rect x="32" y="581.7" width="576" height="130.3" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="124.7" y="207.9" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">start</text>
<text x="185.9" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">sync nibble</text>
<text x="283.8" y="207.9" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">reserved</text>
<text x="345" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">stop</text>
<text x="479.6" y="207.9" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">node address byte</text>
<text x="32" y="256.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SWP</text>
<text x="479.6" y="255.9" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">NODEADDR</text>
<text x="234.9" y="286.1" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">tPAUSE</text>
<text x="32" y="333.5" font-size="17" font-weight="700" fill="#E8EDF3">Timing values</text>
<text x="32" y="369.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">baud</text>
<text x="608" y="369.9" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">min 9000 · max fCLK / 16 bit/s</text>
<text x="32" y="390.1" font-size="15" fill="#D2DAE4">Baud rate (minimum assuming a 20 MHz clock)</text>
<text x="32" y="410.3" font-size="14" fill="#9AA6B5">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="32" y="442.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">tPAUSE</text>
<text x="608" y="442.8" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">max 63 bit times</text>
<text x="32" y="463" font-size="15" fill="#D2DAE4">Start bit to the next start bit within a datagram (longer resets the link)</text>
<text x="32" y="483.1" font-size="14" fill="#9AA6B5">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="32" y="515.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">tIDLE</text>
<text x="608" y="515.6" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">min 12 bit times</text>
<text x="32" y="535.9" font-size="15" fill="#D2DAE4">Bus idle time before a new datagram after a reset or an error</text>
<text x="32" y="556" font-size="14" fill="#9AA6B5">Datasheet 5 UART Single Wire Interface, p. 26</text>
<text x="46" y="610.2" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="630.6" font-size="15" fill="#E2E8F0">The chip measures the bit time from the falling edge of the start bit to</text>
<text x="46" y="652.3" font-size="15" fill="#E2E8F0">the falling edge between sync bits 2 and 3, on every datagram. Each</text>
<text x="46" y="674.1" font-size="15" fill="#E2E8F0">byte is sent least significant bit first; the bytes of a datagram go highest</text>
<text x="46" y="695.8" font-size="15" fill="#E2E8F0">byte first.</text>
</svg>
