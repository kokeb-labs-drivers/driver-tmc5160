<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="817" viewBox="0 0 1200 817" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">TMC5160A</title>
<desc id="chip-hero-desc">Overview of the TMC5160A, a controller and driver for two-phase bipolar stepper motors: it runs the motion profile itself and drives an external MOSFET bridge for coil currents from 1 A to several 10 A. A MCU talks to it over SPI or UART; it drives MOSFET bridge, then Stepper motor; it reads back Coil current, ABN encoder, Reference switches. Headline figures: 10 to 55 V motor and bridge supply; 256 microsteps per full step; 8 gates for an external MOSFET bridge (two full bridges); 4 MHz SPI clock on the internal oscillator; 7 x 7 mm TQFP48 body; also an 8 x 8 mm QFN.</desc>
