<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">TMC5160A</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What talks to it, what it drives and what it reads back, with its headline numbers. Datasheet: Title page, p. 1.</text>
