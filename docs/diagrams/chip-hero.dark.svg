<text x="524" y="256.4" font-size="30" font-weight="700" text-anchor="middle" fill="#E8EDF3">TMC5160A</text>
<text x="524" y="286.4" font-size="17" text-anchor="middle" fill="#9AA6B5">TQFP-48</text>
<text x="524" y="310.4" font-size="16" text-anchor="middle" fill="#9AA6B5">48 pins + pad</text>
<text x="56" y="240.4" font-size="20" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="56" y="271" font-size="17" fill="#D2DAE4">your firmware and</text>
<text x="56" y="295.7" font-size="17" fill="#D2DAE4">this driver</text>
<rect x="264" y="250.4" width="110.9" height="24" rx="12" fill="#0E131A"/>
<text x="319.5" y="268.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">SPI or UART</text>
<text x="735" y="215.4" font-size="20" font-weight="700" fill="#A7F3E6">MOSFET</text>
<text x="735" y="241.4" font-size="20" font-weight="700" fill="#A7F3E6">bridge</text>
<text x="735" y="272" font-size="17" fill="#D2DAE4">8 MOSFETs, two</text>
<text x="735" y="296.7" font-size="17" fill="#D2DAE4">full bridges, gates</text>
<text x="735" y="321.4" font-size="17" fill="#D2DAE4">driven by the chip</text>
<text x="993" y="252.9" font-size="20" font-weight="700" fill="#A7F3E6">Stepper motor</text>
<text x="993" y="283.5" font-size="17" fill="#D2DAE4">two-phase bipolar</text>
<text x="368" y="466.4" font-size="20" font-weight="700" fill="#FDE68A">Reads back</text>
<text x="368" y="497" font-size="17" fill="#D2DAE4">Coil current (sense resistors)</text>
<text x="368" y="521.7" font-size="17" fill="#D2DAE4">ABN encoder</text>
<text x="368" y="546.3" font-size="17" fill="#D2DAE4">Reference switches</text>
<text x="48" y="657.4" font-size="30" font-weight="700" fill="#E8EDF3">10 to 55 V</text>
<text x="48" y="687" font-size="17" fill="#D2DAE4">motor and bridge</text>
<text x="48" y="710" font-size="17" fill="#D2DAE4">supply</text>
<text x="48" y="768.2" font-size="16" fill="#9AA6B5">28.1, p. 120</text>
<text x="278.4" y="657.4" font-size="30" font-weight="700" fill="#E8EDF3">256</text>
<text x="278.4" y="687" font-size="17" fill="#D2DAE4">microsteps per full</text>
<text x="278.4" y="710" font-size="17" fill="#D2DAE4">step</text>
<text x="278.4" y="768.2" font-size="16" fill="#9AA6B5">1.4, p. 8</text>
<text x="508.8" y="657.4" font-size="30" font-weight="700" fill="#E8EDF3">8 gates</text>
<text x="508.8" y="687" font-size="17" fill="#D2DAE4">for an external</text>
<text x="508.8" y="710" font-size="17" fill="#D2DAE4">MOSFET bridge (two</text>
<text x="508.8" y="732.9" font-size="17" fill="#D2DAE4">full bridges)</text>
<text x="508.8" y="768.2" font-size="16" fill="#9AA6B5">2.2, p. 12</text>
<text x="739.2" y="657.4" font-size="30" font-weight="700" fill="#E8EDF3">4 MHz</text>
<text x="739.2" y="687" font-size="17" fill="#D2DAE4">SPI clock on the</text>
<text x="739.2" y="710" font-size="17" fill="#D2DAE4">internal oscillator</text>
<text x="739.2" y="768.2" font-size="16" fill="#9AA6B5">4.3, p. 25</text>
<text x="969.6" y="657.4" font-size="30" font-weight="700" fill="#E8EDF3">7 x 7 mm</text>
<text x="969.6" y="687" font-size="17" fill="#D2DAE4">TQFP48 body; also</text>
<text x="969.6" y="710" font-size="17" fill="#D2DAE4">an 8 x 8 mm QFN</text>
<text x="969.6" y="768.2" font-size="16" fill="#9AA6B5">30.1, p. 128</text>
