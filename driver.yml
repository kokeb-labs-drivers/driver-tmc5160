---
# Driver metadata (handbook KB-REPO-018): kb-core's compatibility catalogue, the MCU gate, the kb tool and the
# configurator read it. CI checks name and version against cmake/tmc5160_build_settings.cmake.
name: tmc5160
version: 0.1.0
bus: [spi, uart]
mcus: [any]         # any, or the MCU families it needs, e.g. [esp32]
peripheral: null    # an MCU peripheral it needs with mcus, e.g. rmt
kb_core_min: null   # the oldest kb-core release whose handler works with this version; null until kb-core exists
authors: ["The driver-tmc5160 authors"]  # the copyright holder, as in LICENSE
